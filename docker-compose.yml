services:
  db:
    image: postgres:15-alpine@sha256:f7d23353e1b15400d22ebe31189f4d314b87a4c129cc400c8c2d8d4ca127bf81
    environment:
    - POSTGRES_USER=${POSTGRES_USER:-admin}
    - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    - POSTGRES_DB=nyc_taxi
    ports:
    - 5432:5432
    volumes:
    - postgres_data:/var/lib/postgresql/data
    networks:
    - ml-network
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U $${POSTGRES_USER} -d nyc_taxi
      interval: 5s
      timeout: 5s
      retries: 30
  mlflow_server:
    build:
      context: .
      dockerfile: services/mlflow/Dockerfile
    ports:
    - 5000:5000
    volumes:
    - mlflow_metadata:/mlflow-data
    networks:
    - ml-network
    environment: &id001
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      minio_init:
        condition: service_completed_successfully
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:5000/health')
      interval: 5s
      timeout: 5s
      retries: 60
    image: taxi-mlflow:demo
  prediction_api:
    build:
      context: .
      dockerfile: services/prediction_api/Dockerfile
    depends_on:
      mlflow_server:
        condition: service_healthy
    environment:
    - MLFLOW_TRACKING_URI=http://mlflow_server:5000
    ports:
    - 8000:8000
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    networks:
    - ml-network
  minio:
    command:
    - server
    - /data
    - --console-address
    - :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
    - 9000:9000
    - 9001:9001
    volumes:
    - minio_data:/data
    networks:
    - ml-network
    build:
      context: .
      dockerfile: services/minio/Dockerfile
  minio_init:
    image: taxi-mlflow:demo
    entrypoint:
    - python
    - services/mlflow/init_bucket.py
    environment: *id001
    depends_on:
    - minio
    networks:
    - ml-network
  prefect_server:
    image: nyc-taxi-pipeline:demo
    build:
      context: .
      dockerfile: services/pipeline/Dockerfile
    command:
    - prefect
    - server
    - start
    - --host
    - 0.0.0.0
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: sqlite+aiosqlite:////prefect-data/prefect.db
      # Relative, so the Prefect UI works from localhost and from a VM address alike.
      PREFECT_UI_API_URL: /api
    ports:
    - 4200:4200
    volumes:
    - prefect_data:/prefect-data
    networks:
    - ml-network
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')
      interval: 5s
      timeout: 5s
      retries: 90
  prefect_bootstrap:
    image: nyc-taxi-pipeline:demo
    command:
    - python
    - services/pipeline/bootstrap.py
    environment:
      PREFECT_API_URL: http://prefect_server:4200/api
      DATABASE_URL: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD}@db:5432/nyc_taxi
      MLFLOW_TRACKING_URI: http://mlflow_server:5000
      DEMO_ROWS: ${DEMO_ROWS:-5000}
    depends_on:
      prefect_server:
        condition: service_healthy
      db:
        condition: service_healthy
      mlflow_server:
        condition: service_healthy
    networks:
    - ml-network
  prefect_worker:
    image: nyc-taxi-pipeline:demo
    command:
    - prefect
    - worker
    - start
    - --pool
    - taxi-docker
    - --type
    - docker
    environment:
      PREFECT_API_URL: http://prefect_server:4200/api
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      prefect_bootstrap:
        condition: service_completed_successfully
    networks:
    - ml-network
    restart: unless-stopped
volumes:
  postgres_data: null
  mlflow_metadata: null
  minio_data: null
  prefect_data: null
networks:
  ml-network:
    driver: bridge
    name: nyc-taxi-ml
